# Let's Encrypt issuers. Start with "letsencrypt-staging" (untrusted certs,
# generous rate limits) to prove the flow, then switch the FrontRow values to
# "letsencrypt-prod".
#
# REPLACE_ME_ACME_EMAIL: an address you control. Let's Encrypt uses it for
# expiry warnings. It is not a secret, but it is not invented here either.
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: REPLACE_ME_ACME_EMAIL
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: REPLACE_ME_ACME_EMAIL
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
