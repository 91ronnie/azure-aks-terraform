apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cratedigger.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cratedigger.labels" . | nindent 4 }}
data:
  HOST: "0.0.0.0"
  PORT: {{ .Values.containerPort | quote }}
  BASE_URL: {{ printf "https://%s" (required "ingress.host is required" .Values.ingress.host) | quote }}
  SPOTIFY_REDIRECT_URI: {{ printf "https://%s/callback" .Values.ingress.host | quote }}
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
