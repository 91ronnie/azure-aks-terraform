# Key Vault -> CSI mount (/mnt/secrets) -> synced Kubernetes Secret -> env vars.
# The sync (secretObjects) is needed because the app reads configuration from
# environment variables. The Secret exists only while a pod mounts the volume
# and is deleted with the last such pod. Rotation: update the value in Key
# Vault; the driver refreshes the Secret within ~2 minutes; environment
# variables only change on restart (kubectl rollout restart deploy/cratedigger).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "cratedigger.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cratedigger.labels" . | nindent 4 }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: {{ required "serviceAccount.workloadIdentityClientId is required" .Values.serviceAccount.workloadIdentityClientId | quote }}
    keyvaultName: {{ required "keyVault.name is required" .Values.keyVault.name | quote }}
    tenantId: {{ required "keyVault.tenantId is required" .Values.keyVault.tenantId | quote }}
    objects: |
      array:
        {{- range $env, $secret := .Values.keyVault.secrets }}
        - |
          objectName: {{ $secret }}
          objectType: secret
        {{- end }}
  secretObjects:
    - secretName: {{ include "cratedigger.secretName" . }}
      type: Opaque
      data:
        {{- range $env, $secret := .Values.keyVault.secrets }}
        - key: {{ $env }}
          objectName: {{ $secret }}
        {{- end }}
