apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cratedigger.labels" . | nindent 4 }}
  annotations:
    # Federated with id-<env>-cratedigger (Terraform: cratedigger.tf). Grants
    # Key Vault read and PostgreSQL Entra admin - nothing else.
    azure.workload.identity/client-id: {{ required "serviceAccount.workloadIdentityClientId is required" .Values.serviceAccount.workloadIdentityClientId | quote }}
automountServiceAccountToken: false
