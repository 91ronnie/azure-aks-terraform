{{- if .Values.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "frontrow-api.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "frontrow-api.labels" (dict "root" . "component" "api") | nindent 4 }}
spec:
  minAvailable: {{ .Values.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "frontrow-api.selectorLabels" (dict "root" . "component" "api") | nindent 6 }}
{{- end }}
