apiVersion: v1
kind: Service
metadata:
  name: {{ include "frontrow-api.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "frontrow-api.labels" (dict "root" . "component" "api") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "frontrow-api.selectorLabels" (dict "root" . "component" "api") | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
