# Key Vault -> CSI mount (/mnt/secrets) -> synced Kubernetes Secret -> env vars.
# The sync (secretObjects) is needed because Laravel reads configuration from
# environment variables. The Secret exists only while a pod mounts the volume.
# Rotation: update the value in Key Vault; the driver refreshes the Secret
# within ~2 minutes; env vars change on restart
# (kubectl -n frontrow-api rollout restart deploy).
{{- $secrets := include "frontrow-api.allSecrets" . | fromYaml }}
{{- $objects := list }}
{{- range $env, $name := $secrets }}{{ $objects = append $objects $name }}{{ end }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "frontrow-api.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "frontrow-api.labels" (dict "root" . "component" "secrets") | nindent 4 }}
  annotations:
    # Must exist before the migration job (sync wave 0) mounts it.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: {{ required "serviceAccount.workloadIdentityClientId is required" .Values.serviceAccount.workloadIdentityClientId | quote }}
    keyvaultName: {{ required "keyVault.name is required" .Values.keyVault.name | quote }}
    tenantId: {{ required "keyVault.tenantId is required" .Values.keyVault.tenantId | quote }}
    objects: |
      array:
        {{- range ($objects | uniq | sortAlpha) }}
        - |
          objectName: {{ . }}
          objectType: secret
        {{- end }}
  secretObjects:
    - secretName: {{ include "frontrow-api.secretName" . }}
      type: Opaque
      data:
        {{- range $env, $name := $secrets }}
        - key: {{ $env }}
          objectName: {{ $name }}
        {{- end }}
