apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "frontrow-api.labels" (dict "root" . "component" "api") | nindent 4 }}
  annotations:
    # Federated with id-<env>-api (Terraform: api.tf). Grants Key Vault read on
    # the API's own vault - nothing else.
    azure.workload.identity/client-id: {{ required "serviceAccount.workloadIdentityClientId is required" .Values.serviceAccount.workloadIdentityClientId | quote }}
    argocd.argoproj.io/sync-wave: "-1"
automountServiceAccountToken: false
