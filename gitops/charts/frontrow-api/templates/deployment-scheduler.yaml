{{- if .Values.scheduler.enabled }}
# Laravel scheduler (was a per-minute cron entry on every EC2 instance).
# Exactly one replica, Recreate: two schedulers would run each task twice.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "frontrow-api.fullname" . }}-scheduler
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "frontrow-api.labels" (dict "root" . "component" "scheduler") | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "frontrow-api.selectorLabels" (dict "root" . "component" "scheduler") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "frontrow-api.selectorLabels" (dict "root" . "component" "scheduler") | nindent 8 }}
        azure.workload.identity/use: "true"
      annotations:
        {{- include "frontrow-api.podAnnotations" . | nindent 8 }}
    spec:
      {{- include "frontrow-api.podCommon" . | nindent 6 }}
      terminationGracePeriodSeconds: 60
      containers:
        - name: scheduler
          {{- include "frontrow-api.phpContainer" . | nindent 10 }}
          command: ["frontrow-entrypoint"]
          args: ["php", "artisan", "schedule:work", "--no-interaction"]
          resources:
            {{- toYaml .Values.scheduler.resources | nindent 12 }}
      volumes:
        {{- include "frontrow-api.phpVolumes" . | nindent 8 }}
{{- end }}
