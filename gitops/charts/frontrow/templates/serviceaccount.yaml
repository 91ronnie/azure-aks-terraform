{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "frontrow.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "frontrow.labels" . | nindent 4 }}
  {{- if .Values.keyVault.enabled }}
  annotations:
    azure.workload.identity/client-id: {{ required "serviceAccount.workloadIdentityClientId is required when keyVault.enabled" .Values.serviceAccount.workloadIdentityClientId | quote }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
