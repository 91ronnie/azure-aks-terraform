{{- if .Values.keyVault.enabled }}
# Mounts Key Vault secrets as files using the AKS Key Vault Secrets Provider
# add-on, authenticated with the pod's workload identity. No Kubernetes Secret
# object is created (no secretObjects), so values exist only in the tmpfs mount.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "frontrow.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "frontrow.labels" . | nindent 4 }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: {{ required "serviceAccount.workloadIdentityClientId is required" .Values.serviceAccount.workloadIdentityClientId | quote }}
    keyvaultName: {{ required "keyVault.name is required" .Values.keyVault.name | quote }}
    tenantId: {{ required "keyVault.tenantId is required" .Values.keyVault.tenantId | quote }}
    objects: |
      array:
        {{- range .Values.keyVault.objects }}
        - |
          objectName: {{ .name }}
          objectType: secret
        {{- end }}
{{- end }}
