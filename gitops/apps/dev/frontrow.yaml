# The FrontRow web application. The chart lives in gitops/charts/frontrow and
# the environment values (including the image tag/digest written by the web
# pipeline) in gitops/environments/dev/frontrow/values.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frontrow-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: frontrow
  source:
    repoURL: https://dev.azure.com/REPLACE_ME_ORG/REPLACE_ME_PROJECT/_git/REPLACE_ME_REPO
    targetRevision: main
    path: gitops/charts/frontrow
    helm:
      releaseName: frontrow
      valueFiles:
        - ../../environments/dev/frontrow/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: frontrow
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/audit: restricted
        pod-security.kubernetes.io/warn: restricted
    syncOptions:
      - CreateNamespace=true
  revisionHistoryLimit: 10
